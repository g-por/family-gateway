server:
  port: 8080

spring:
  cloud:
    gateway:

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

      routes:
        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/api/users/**
          filters:
            - RewritePath=/api/users/(?<segment>.*),/api/$\{segment}

        - id: budget-service
          uri: http://budget-service:8080
          predicates:
            - Path=/api/budget/**
          filters:
            - name: RewritePath
              args:
                regexp: ^/api/budget/(?<segment>.*)
                replacement: /budget/${segment}

        - id: analytics-service
          uri: http://analitic-service:8080
          predicates:
            - Path=/api/analytics/**
          filters:
            - name: RewritePath
              args:
                regexp: ^/api/analytics/(?<segment>.*)
                replacement: /api/${segment}

          default-filters:
            - AddResponseHeader=X-Gateway, FamilyBudget

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.server: INFO

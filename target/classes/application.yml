server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8080
          predicates:
            - Path=/api/users/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}   # ← тут
        - id: budget-service
          uri: http://budget-service:8080
          predicates:
            - Path=/api/budget/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}
        - id: analytics-service
          uri: http://analytics-service:8080
          predicates:
            - Path=/api/analytics/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}
      default-filters:
        - AddResponseHeader=X-Gateway, FamilyBudget

management:
  endpoints:
    web:
      exposure:
        include: gateway,health,info

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.server: INFO
